[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel agent built on Deep Agents."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.3.14,<2.0",
    "langchain-anthropic>=1.5.2,<2.0",
    "langgraph>=1.2.9,<2.0",
    "langchain-tavily>=0.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
