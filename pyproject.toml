[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel agent built on Deep Agents."
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    # Ceiling, not caprice: 0.7.0 removes `StoreBackend()` without an explicit
    # `namespace`, which `agent.py:build_backend` relies on. Without the bound,
    # the day 0.7.0 ships an unrelated re-lock silently breaks `/memories/`.
    # Lift it together with that call, not before.
    "deepagents>=0.6.12,<0.7",
    "langchain>=1.3.14,<2.0",
    # 1.5.2 cannot complete a turn on Claude Opus 5: streaming rebuilds the
    # assistant message from chunks and drops the thinking block's text, so
    # replaying it is rejected with `thinking.thinking: Field required`. That
    # breaks every entry point here, all of which stream. uv.lock protects
    # local dev and CI; this floor protects anything installing the built
    # package, which resolves from here instead.
    "langchain-anthropic>=1.5.3,<2.0",
    "langgraph>=1.2.9,<2.0",
    "langchain-tavily>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
