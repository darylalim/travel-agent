[project]
name = "travel-agent"
version = "0.2.0"
description = "Travel planning agent on Deep Agents. Research destinations and search flight and lodging inventory via Duffel."
readme = "README.md"
# PEP 639: an SPDX expression plus the file it resolves to, so the built wheel
# carries the licence text as well as the identifier. A bare LICENSE at the repo
# root satisfies GitHub but leaves the distributed artefact unlicensed.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
    # Floor, not caprice: 0.7.0 made `StoreBackend`'s `namespace` required and
    # deleted the legacy `assistant_id` fallback that decided where /memories/
    # actually lived. `agent.py:_memories_namespace` restates that fallback, so
    # the two move together — a namespace that looks reasonable but differs
    # orphans existing traveler profiles, and a missing profile is skipped
    # silently rather than raised. The `<0.8` bound is because 0.7 also dropped
    # `TodoListMiddleware` and the library's base prompt from the default
    # stack: prompt surface is part of this dependency, and `prompts.py` is
    # tuned against whatever it leaves behind. Read the diff before lifting.
    "deepagents>=0.7.8,<0.8",
    "langchain>=1.3.14,<2.0",
    # 1.5.2 cannot complete a turn on Claude Opus 5: streaming rebuilds the
    # assistant message from chunks and drops the thinking block's text, so
    # replaying it is rejected with `thinking.thinking: Field required`. That
    # breaks every entry point here, all of which stream. uv.lock protects
    # local dev and CI; this floor protects anything installing the built
    # package, which resolves from here instead.
    "langchain-anthropic>=1.5.3,<2.0",
    "langgraph>=1.2.9,<2.0",
    "langchain-tavily>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "streamlit>=1.60.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    # Already installed via langchain-core, but tests/conftest.py relies on two
    # langsmith details directly: `tracing_context(enabled=False)` outranking
    # the environment, and env reads going through an `lru_cache`.
    "langsmith>=0.14",
    "pytest>=8.0",
    "ruff>=0.9",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
# The repo root, so tests can import `evals` — the eval harness is not part of
# the installed package (the wheel is `src/travel_agent` only).
pythonpath = ["."]
