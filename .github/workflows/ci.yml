name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a PR branch makes the in-flight run obsolete — that is what
# this is for. A second push to main does not: every commit there is a
# permanent point in history, and cancelling its run leaves that commit with a
# verdict nothing will ever recompute. Expressions are allowed in this field.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, pins, graph import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # setup-uv is pinned to a full version on purpose, here and in the two
      # jobs below. From v8 the action stopped publishing floating major tags
      # in response to the tj-actions supply-chain attack, so `@v10` does not
      # resolve — and every release from v8 on is immutable, which is what
      # makes a version tag as firm as a commit sha. Bump all three together.
      #
      # v9 also flipped `prune-cache` to default false, to spare PyPI the
      # re-downloads pruning causes. Caches are correspondingly larger; that
      # is upstream's call and this workflow takes it rather than pinning the
      # old behaviour back.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # Explicitly true, not the `auto` default: from v10 `auto` disables
          # the cache for pull_request_target, workflow_run and release, none
          # of which this workflow triggers on.
          enable-cache: true
          # 3.11 is the pinned target for ruff, ty, and langgraph.json alike —
          # and so the interpreter the graph import below has to run on, since
          # that is the one a deploy uses.
          python-version: "3.11"

      # --locked fails if uv.lock has drifted from pyproject.toml, so a
      # dependency change that never made it into the lockfile is caught here
      # rather than as a mystery resolution difference later.
      - run: uv sync --locked

      - name: ruff check
        run: uv run --no-sync ruff check .

      # --check only. `ruff check --fix` is deliberately never run in this
      # project: there is no [tool.ruff.lint] select, so the default set
      # includes F401, whose "safe" fix deletes unused imports. See
      # .claude/hooks/python-gate.sh for the incident that established this.
      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      - name: ty check
        run: uv run --no-sync ty check

      # CLAUDE.md: three places pin 3.11 and have to stay in agreement.
      # Nothing else enforces it, and disagreement fails at deploy time.
      - name: Python version pins agree
        run: |
          uv run --no-sync python - <<'PY'
          import json, pathlib, sys, tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          ruff_target = pyproject["tool"]["ruff"]["target-version"]  # "py311"

          pins = {
              "[tool.ruff] target-version": f"{ruff_target[2]}.{ruff_target[3:]}",
              "[tool.ty.environment] python-version":
                  pyproject["tool"]["ty"]["environment"]["python-version"],
              "langgraph.json python_version":
                  json.loads(pathlib.Path("langgraph.json").read_text())["python_version"],
          }
          for where, value in pins.items():
              print(f"  {value}  <- {where}")
          if len(set(pins.values())) > 1:
              sys.exit("\nThese three must agree — see CLAUDE.md, 'Commands'.")
          PY

      # agent.py builds the agent as an import side effect, because
      # langgraph.json needs a module-level `graph`. That constructs a model
      # client and the full tool stack, so a bad tool signature or a stale
      # deepagents argument breaks `langgraph dev` at startup — and the test
      # suite never touches this path, by design.
      #
      # No ANTHROPIC_API_KEY and no TAVILY_API_KEY are set anywhere in this
      # workflow: the graph must build without credentials (only the search
      # tool is conditional), and nothing here can reach a paid API.
      #
      # This was its own job. Folding it in costs one thing and buys one: the
      # verdict is now withheld on a run already red for lint or type reasons,
      # in exchange for a whole runner whose environment was byte-identical to
      # this one. Keep it in *this* job — the 3.11 above is the point.
      - name: Import every graph langgraph.json declares
        run: |
          uv run --no-sync python - <<'PY'
          import importlib.util, json, pathlib

          config = json.loads(pathlib.Path("langgraph.json").read_text())
          graphs = config["graphs"]
          # An empty mapping iterates zero times and exits 0 — a green check for
          # having imported nothing, which is the same failure class as a static
          # scan that quietly stops matching (tests/test_env_isolation.py).
          assert graphs, "langgraph.json declares no graphs"
          for name, target in graphs.items():
              file, _, attribute = target.rpartition(":")
              spec = importlib.util.spec_from_file_location(f"_langgraph_{name}", file)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              graph = getattr(module, attribute)
              print(f"  {name}: {target} -> {type(graph).__name__}")
          PY

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the supported range: 3.11 is what langgraph.json
        # deploys on and what ruff and ty target, 3.13 is the top of the looser
        # requires-python = ">=3.11,<4.0" the package advertises.
        #
        # Nothing sits between them. numpy is the only package uv.lock resolves
        # to two versions (2.4.6 below 3.12, 2.5.2 at or above), and these two
        # legs straddle that boundary, so a 3.12 leg would install a set neither
        # end misses. Add one back the day `uv lock` forks a *second* package at
        # a different boundary — two boundaries leave a middle band untested.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - run: uv sync --locked

      # No network, no model calls, no API token: conftest.py's autouse
      # fixture unsets the provider env vars around every test.
      - name: pytest
        run: uv run --no-sync pytest -q

  hooks:
    name: Claude Code hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both legs are load-bearing, and macOS is the one that matters most:
        # it is the userland the hooks actually execute in (bash 3.2, BSD grep
        # and sed), and protect-env.sh fails OPEN on a grep error — a segment
        # whose `grep -qE` exits non-zero is read as "no match in this segment"
        # and allowed. So a GNU-only construct (`grep -P`, `${verb,,}`) passes
        # all 61 cases on ubuntu while silently disarming every deny case on the
        # developer's machine. ubuntu is the cheap second opinion; it cannot
        # substitute for the leg that runs the real shell.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      # python-gate.sh and turn-gate.sh shell out to `uv run`, and both exit 0
      # silently when uv is absent — which would turn their failing cases into
      # false passes. So the environment has to be real and synced.
      - run: uv sync --locked

      - name: test-hooks.sh
        run: |
          # Every assertion parses hook JSON with jq. Without it all 61 cases
          # fail at once, which reads as a hook regression rather than a
          # missing tool. Both runner images ship jq; say so plainly if not.
          command -v jq >/dev/null || { echo "::error::jq is required by the hook tests"; exit 1; }
          bash .claude/hooks/test-hooks.sh

  # Bumping [project] version in pyproject.toml on main tags that commit and
  # publishes a GitHub release. Nothing is uploaded anywhere else: the PyPI name
  # `travel-agent` belongs to an unrelated project, so there is no publish step,
  # no stored secret and no id-token — GITHUB_TOKEN with contents: write does
  # both halves, since a tag ref and a release are both contents-scope.
  #
  # The gate is LEVEL-triggered — it asks origin whether refs/tags/vX exists,
  # never what this push changed. A diff against HEAD^ is wrong here in three
  # independent ways: checkout fetches one commit so HEAD^ may not exist, a push
  # can carry several commits and the bump need not be in the last one, and a
  # re-run re-reads the same diff and tags twice. Asking about the tag converges
  # from any history shape, so a cancelled, failed or re-run job is simply
  # completed by the next push rather than duplicating or skipping work.
  #
  # Depends on every other job, and this is the one place that matters: a
  # release is where the macOS hook leg's verdict reaches someone who is not
  # the author. On pull requests the job is skipped, which is correct and free.
  release:
    name: Tag and release on version bump
    needs: [quality, test, hooks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job-scoped: this replaces the workflow-level `contents: read` here only.
    # The other three jobs run `uv sync`, which executes build hooks from
    # several hundred third-party packages; none of them gets a writable token.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history, because the notes are a commit range and the default
      # fetch-depth of 1 leaves nothing to range over. Tags arrive with it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Is this version already tagged?
        id: gate
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, sys, tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]

          # Final releases only. A bare "is it tagged yet" test would let
          # 0.2.0rc1 cut a real, published, *latest* release, and this repo has
          # no prerelease practice to fall back on — the first rc would invent
          # one by accident. Supporting them later means an explicit
          # --prerelease flag and a decision about what "latest" means.
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              sys.exit(f"::error::[project] version is not a final release: {version!r}")
          tag = f"v{version}"

          # Ask the remote, not the checkout: ls-remote is the same answer a
          # concurrent run would get, and it is true regardless of fetch depth.
          # Peeled refs (`refs/tags/vX^{}`) are annotated-tag artefacts, not tags.
          refs = subprocess.run(
              ["git", "ls-remote", "--tags", "origin", "refs/tags/v*"],
              capture_output=True, text=True, check=True,
          ).stdout
          published = {
              line.split("refs/tags/")[1]
              for line in refs.splitlines()
              if "refs/tags/" in line and not line.endswith("^{}")
          }

          def parts(t: str) -> tuple[int, ...]:
              return tuple(int(n) for n in t[1:].split("."))

          if tag in published:
              print(f"{tag} is already tagged — nothing to release.")
              new = False
          else:
              # Refuse to go backwards. A revert of the bump commit, a
              # cherry-pick or a rewritten main can leave pyproject at a version
              # below one that already shipped, and a release is not a state you
              # can take back — a tag that moves detaches every clone.
              final = [t for t in published if re.fullmatch(r"v\d+\.\d+\.\d+", t)]
              if final:
                  highest = max(final, key=parts)
                  if parts(tag) < parts(highest):
                      sys.exit(f"::error::{tag} is below the released {highest}")
              print(f"{tag} is new — releasing.")
              new = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"tag={tag}", file=out)
              print(f"needs_tag={str(new).lower()}", file=out)
          PY

      # Asked separately from the tag, and that separation is the point: a run
      # that created the tag and then died leaves a tag with no release, and a
      # single "already released?" gate would treat that state as finished
      # forever. Two probes let the next push create only the missing half.
      - name: Does the release already exist?
        id: existing
        env:
          # Via env rather than inline `${{ }}`, so the shell never sees an
          # expansion it did not quote. The value is already constrained to
          # v\d+\.\d+\.\d+ by the step above; this keeps that property readable
          # here instead of one step away.
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
            echo "$TAG already has a release."
          else
            echo "needs_release=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to github.sha — the commit the four jobs above actually tested.
      # Letting the tag resolve to a branch name instead points it at main's
      # head at API-call time, which under any concurrent push is a commit
      # nothing verified.
      - name: Create the tag
        if: steps.gate.outputs.needs_tag == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA"

      # Notes are the commit subjects. `--generate-notes` enumerates merged pull
      # requests, and every commit in this repo lands directly on main — it
      # would emit a body with a compare link and nothing else, which reads as a
      # broken release rather than a quiet one. A CHANGELOG.md would be a third
      # place the version lives alongside pyproject.toml and the tag, restating
      # the log it is generated from.
      - name: Publish the release
        if: steps.gate.outputs.needs_tag == 'true' || steps.existing.outputs.needs_release == 'true'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          # Range to the tag when it already exists locally, to github.sha when
          # it does not. They are the same commit on the normal path — the tag
          # was just created at that sha and is not in this checkout. They
          # differ only when healing a tag an earlier run left behind, and there
          # ranging to HEAD would file every commit since under a release the
          # tag says stopped earlier.
          endpoint=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || echo "$GITHUB_SHA")
          previous=$(git tag --list 'v*' --sort=-v:refname | grep -vFx "$TAG" | head -1)
          if [ -n "$previous" ]; then
            git log "$previous..$endpoint" --no-merges --reverse --format='- %s' > notes.md
            printf '\n[Full diff](%s/%s/compare/%s...%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          else
            git log "$endpoint" --no-merges --reverse --format='- %s' > notes.md
          fi
          # Commit subjects reach the body through a file, never through the
          # shell — a subject containing backticks or $(…) is data here, not code.
          #
          # --verify-tag so this can only ever attach to a tag that already
          # exists at that sha; tag creation stays in exactly one step above.
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
